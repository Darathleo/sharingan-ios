name: Build Sharingan IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q Sharingan_iOS_Projeto.zip
      - name: Build for iPhone
        run: |
          xcodebuild -project Sharingan/Sharingan.xcodeproj \
            -scheme Sharingan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sharingan.app Payload/
          test -d Payload/Sharingan.app/PlugIns/SharinganWidget.appex
          zip -qry Sharingan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Sharingan-IPA
          path: Sharingan.ipa
          if-no-files-found: error
